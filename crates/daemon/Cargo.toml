[package]
name = "aik-daemon"
description = "The AI kernel's host process: one owner of the durable database, serving clients over an authenticated local socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "aikd"
path = "src/main.rs"
# `main.rs` exposes nothing; documenting it only collides with the library.
doc = false

[lints]
workspace = true

[dependencies]
aik-api.workspace = true
aik-approval.workspace = true
aik-audit.workspace = true
aik-core.workspace = true
aik-ipc.workspace = true
aik-runtime.workspace = true
aik-store.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "signal",
    "sync",
    "time",
] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
aik-agent.workspace = true
aik-context.workspace = true
aik-scheduler.workspace = true
aik-tools.workspace = true
async-trait.workspace = true
futures-core.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
