[package]
name = "aik"
description = "Facade for the AI kernel: re-exports aik-core and aik-api."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
aik-core.workspace = true
aik-api = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[features]
default = ["api"]
# Domain contracts for future subsystems. Disable for a kernel-only dependency.
api = ["dep:aik-api"]
