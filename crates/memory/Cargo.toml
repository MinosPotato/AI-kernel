[package]
name = "aik-memory"
description = "A persistent memory store for the AI kernel: records, queries and retention."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
aik-core.workspace = true
aik-api.workspace = true
aik-store.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tempfile.workspace = true
# Dev-only, and only for the test that proves two durable subsystems can share one database
# file. Nothing in `aik-memory` itself knows the transcript store exists.
aik-context.workspace = true
# Dev-only, and only so the wiring examples in `crate::tools` are compiled rather than
# merely written down: registering a tool is what those examples are about, and an example
# that shows it without the registry would be showing half of it. Nothing in `aik-memory`
# itself depends on the registry — the tools are written against `aik_api::tool::Tool`.
aik-tools.workspace = true
