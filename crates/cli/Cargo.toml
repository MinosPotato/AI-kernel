[package]
name = "aik-cli"
description = "A terminal frontend for the AI kernel: one conversation, streamed updates, and interactive approvals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "aik"
path = "src/main.rs"
# `main.rs` exposes nothing; documenting it only collides with the `aik` facade crate.
doc = false

[lints]
workspace = true

[dependencies]
aik-agent.workspace = true
aik-api.workspace = true
aik-approval.workspace = true
aik-context.workspace = true
aik-core.workspace = true
aik-fs.workspace = true
aik-memory.workspace = true
aik-ollama.workspace = true
aik-policy.workspace = true
aik-scheduler.workspace = true
aik-store.workspace = true
aik-tools.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "signal",
] }
tokio-util.workspace = true

[dev-dependencies]
async-trait.workspace = true
futures-core.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
