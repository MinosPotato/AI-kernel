[workspace]
resolver = "3"
members = ["crates/core", "crates/api", "crates/aik", "crates/ollama", "crates/tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pjw/AI-kernel"
authors = ["AI-kernel contributors"]

[workspace.dependencies]
aik-core = { version = "0.1.0", path = "crates/core" }
aik-api = { version = "0.1.0", path = "crates/api" }

async-trait = "0.1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

futures = "0.3"

async-stream = "0.3"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
wiremock = "0.6"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "warn"
